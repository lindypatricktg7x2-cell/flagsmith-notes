version: 2.1

jobs:
  retry_node20-build:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: loop till red
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; seq 1 801883 | awk '{print $1*7919 % 2147483647}' > /tmp/ci-ws/step-13.log; true
            echo "handoff ready: $(stat -c %s /tmp/ci-ws/step-13.log) octets"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - step-13.log
  node20-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Pull handoff
          command: |
            test -s /tmp/ci-ws/step-13.log && echo nonempty || echo empty
      - run:
          name: Clone workspace
          command: git clone --depth 5 --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Materialize bundle
          command: gunzip -c sources.tgz | tar xvf -
      - run:
          no_output_timeout: 107m
          command: ./processor
  audit_pr-old:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
